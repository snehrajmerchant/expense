<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Expenses</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("expenses.theme") === "light" ? "light" : "dark";
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <div class="mark">EX</div>
          <div>
            <h1>Expenses</h1>
            <p class="subtitle" id="subtitle">Monthly budget by category and subcategory</p>
          </div>
        </div>
        <div class="header-right">
          <div class="view-tabs" role="tablist" aria-label="Views">
            <button type="button" class="btn view-tab active" id="budgetTab" role="tab" aria-selected="true" aria-controls="budgetView">Budget</button>
            <button type="button" class="btn view-tab" id="dashTab" role="tab" aria-selected="false" aria-controls="dashView">Dashboard</button>
          </div>
          <button type="button" class="btn primary" id="printBtn" hidden>Print PDF</button>
          <button type="button" class="btn" id="saveBtn">Save</button>
          <button type="button" class="btn" id="openBtn">Open</button>
          <input type="file" id="openFile" accept="application/json,.json" hidden />
          <button type="button" class="nav-icon" id="themeBtn" title="Switch to light mode" aria-label="Switch to light mode" aria-pressed="false">
            <svg class="theme-icon-moon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M12.6 10.2A5.4 5.4 0 0 1 6.2 3.1 5.5 5.5 0 1 0 12.6 10.2z" fill="none" stroke="currentColor" stroke-linejoin="round" />
            </svg>
            <svg class="theme-icon-sun" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" />
              <path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" fill="none" stroke="currentColor" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="btn danger" id="clearAllBtn">Clear all</button>
        </div>
      </header>

      <section class="stats-bar" aria-label="Budget totals">
        <div class="stat">
          <span class="stat-label">Monthly</span>
          <span class="stat-value" id="statMonthly">$0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Annual</span>
          <span class="stat-value accent" id="statAnnual">$0</span>
        </div>
        <div class="stat stat-progress">
          <span class="stat-label">Essential <em id="essentialShare">0%</em></span>
          <span class="stat-value ok" id="statEssential">$0</span>
          <div class="progress" aria-hidden="true"><div class="progress-bar" id="essentialBar"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Discretionary</span>
          <span class="stat-value" id="statOther">$0</span>
        </div>
        <div class="stat">
          <span class="stat-label">With an amount</span>
          <span class="stat-value" id="statFilled">0 / 0</span>
        </div>
      </section>

      <div class="workspace" id="budgetView" role="tabpanel">
        <nav class="panel cat-list" id="catList" aria-label="Categories"></nav>
        <section class="panel detail" aria-labelledby="detailTitle">
          <div class="detail-head">
            <div class="detail-title">
              <h2 id="detailTitle">Home</h2>
              <span class="detail-meta">Monthly amount. Check the box if the cost is essential.</span>
            </div>
            <div class="detail-figures">
              <span id="detailMonthly">$0</span>
              <span id="detailAnnual">$0 / yr</span>
            </div>
            <button type="button" class="nav-icon" id="addSubBtn" title="Add subcategory" aria-label="Add subcategory">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-linecap="round" />
              </svg>
            </button>
            <button type="button" class="btn danger" id="clearCatBtn">Clear</button>
          </div>
          <div class="sub-grid" id="subList"></div>
        </section>
      </div>

      <section class="dashboard" id="dashView" role="tabpanel" aria-label="Expense dashboard" hidden>
        <div class="dash-panel dash-side">
          <h2 class="dash-panel-title">Monthly share</h2>
          <div class="donut-wrap" id="dashDonut"></div>
          <div class="split" id="dashSplit"></div>
        </div>
        <div class="dash-panel dash-bars">
          <h2 class="dash-panel-title">Every category</h2>
          <div class="bar-list" id="dashBars"></div>
        </div>
      </section>
      <section class="print-report" id="printReport" aria-hidden="true"></section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
